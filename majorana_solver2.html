<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Majorana Solver</title>
  <link rel="stylesheet" href="style.css">
  <!-- Load Math.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
</head>
<body>
  <h1>⚛️ Majorana Solver</h1>
  <p>Type any math expression or equation (e.g., 2+3, sqrt(16), x^2+5x+6=0, x+y=5, x-y=1)</p>
  <textarea id="problem" rows="3" cols="40"></textarea><br>
  <button onclick="solve()">Solve</button>
  <div id="result"></div>
  <script src="script.js"></script>
</body>
</html>
